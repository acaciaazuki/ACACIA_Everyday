<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>地圖模組測試</title>
  <style>
    /* 讓地圖容器填滿整個畫面 */
    body, html { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>

  <!-- 地圖顯示區塊 -->
  <div id="map"></div>

  <script>
    let map;

    // 非同步函數：負責載入與初始化地圖
    async function initMap() {
      try {
        // Marker 不會隨 maps library 一起載入，必須明確載入 marker library。
        const [{ Map }, { Marker }] = await Promise.all([
          google.maps.importLibrary("maps"),
          google.maps.importLibrary("marker")
        ]);

      // 1. 初始化地圖 (預設中心點設為台北 101)
      const center = { lat: 25.033964, lng: 121.564468 };
      map = new Map(document.getElementById("map"), {
        center,
        zoom: 15,
        disableDefaultUI: true, // 關閉預設的 Google 縮放控制與按鈕，方便您疊加自己的 UI
      });

      // 2. 建立一個自訂地點標記 (模擬您的書籤或咖啡廳地標)
      const customMarker = new Marker({
        position: center,
        map,
        title: "測試咖啡廳",
      });

      // 3. 加入點擊互動
      customMarker.addListener("click", () => {
        alert("成功點擊標記！這裡未來會彈出您的編輯與筆記視窗。");
      });
      } catch (error) {
        console.error("Google 地圖初始化失敗:", error);
        document.getElementById("map").textContent =
          "地圖載入失敗，請確認 API 金鑰、Maps JavaScript API 與 Marker library 已啟用。";
      }
    }
  </script>

  <!-- 載入 Google Maps API 腳本 -->
  <!-- 請在部署環境注入有效的 Google Maps API 金鑰，不要將金鑰提交至儲存庫。 -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&loading=async&callback=initMap"></script>

</body>
</html>
