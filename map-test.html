<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>地圖模組測試</title>
  <style>
    /* 讓地圖容器填滿整個畫面 */
    body, html { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>

  <!-- 地圖顯示區塊 -->
  <div id="map"></div>

  <script>
    let map;

    // 非同步函數：負責載入與初始化地圖
    async function initMap() {
      // 動態載入核心地圖與標記功能
      const { Map } = await google.maps.importLibrary("maps");
      const { Marker } = await google.maps.importLibrary("marker");

      // 1. 初始化地圖 (預設中心點設為台北 101)
      map = new Map(document.getElementById("map"), {
        center: { lat: 25.033964, lng: 121.564468 },
        zoom: 15,
        disableDefaultUI: true, // 關閉預設的 Google 縮放控制與按鈕，方便您疊加自己的 UI
      });

      // 2. 建立一個自訂地點標記 (模擬您的書籤或咖啡廳地標)
      const customMarker = new Marker({
        position: { lat: 25.033964, lng: 121.564468 },
        map: map,
        title: "測試咖啡廳",
        // 之後您可以把這裡換成您準備好的插畫圖示路徑：
        // icon: "./assets/icons/coffee-icon.png" 
      });

      // 3. 加入點擊互動
      customMarker.addListener("click", () => {
        alert("成功點擊標記！這裡未來會彈出您的編輯與筆記視窗。");
      });
    }
  </script>

  <!-- 載入 Google Maps API 腳本 -->
  <!-- 請將 YOUR_API_KEY_HERE 替換為您剛剛複製的金鑰 -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB25jh4am59P5uuvGFxoL3DTIIeiiMSyM0&callback=initMap"></script>

</body>
</html>
