<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7faf8">
<title>BrainBox+ — 把每一天，過得剛剛好</title>
<!-- Leaflet fallback interactive map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{--ink:#263633;--muted:#8a9893;--sage:#4a987b;--sage-light:#eaf6ef;--sage-dark:#3d876c;--mint:#dff2e9;--line:#edf1ee;--paper:#fff;--bg:#f7faf8;--shadow:0 12px 36px #29483a0b;--shadow-sm:0 2px 8px #29483a08;--nav-w:240px;--radius:14px;--radius-sm:10px;--tr:.2s ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;border:0;outline:0}
button{cursor:pointer;color:inherit;background:none}
::placeholder{color:#b0b8b3}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d5ddd8;border-radius:3px}

/* ═══ Shell ═══ */
.shell{display:flex;min-height:100vh}

/* ═══ Sidebar ═══ */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--nav-w);padding:24px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 28px;font-size:18px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.brandmark{width:36px;height:36px;border-radius:12px;background:var(--mint);color:var(--sage);display:grid;place-items:center;font-size:18px}
.nav-label{font-size:10px;color:#a4afaa;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:16px 12px 8px}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:var(--radius-sm);color:#7e8b85;text-align:left;font-weight:600;font-size:13px;transition:var(--tr)}
.nav button:hover{background:#f6f9f7;color:#5a6d63}
.nav button.active{background:var(--sage-light);color:var(--sage-dark)}
.nav .ico{width:20px;text-align:center;font-size:16px}
.nav .count{margin-left:auto;background:#f1f4f2;color:#8c9993;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700}
.sidebar-bottom{margin-top:auto}
.profile{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:#f8e9da;display:grid;place-items:center;font-size:16px}
.profile-info strong{font-size:12px;display:block}
.profile-info small{font-size:10px;color:var(--muted)}

/* ═══ Mobile Bottom Nav ═══ */
.mobile-nav{display:none;position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around;box-shadow:0 -4px 20px #29483a08}
.mobile-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#8a9893;padding:4px 12px;border-radius:10px;transition:var(--tr)}
.mobile-nav button .m-ico{font-size:17px}
.mobile-nav button.active{color:var(--sage-dark);background:var(--sage-light)}

/* ═══ Main ═══ */
.main{margin-left:var(--nav-w);width:calc(100% - var(--nav-w));padding:24px 36px 60px;max-width:1400px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.crumb{font-size:12px;color:#9aa59f}.crumb b{color:#53645c;font-weight:600}
.top-actions{display:flex;align-items:center;gap:8px}
.search-box{height:36px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);color:#9aa59f;display:flex;align-items:center;gap:12px;font-size:12px;transition:var(--tr)}
.search-box:hover{border-color:#c5d0c9;color:var(--ink)}
.search-box kbd{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#b5bdb8;font-family:inherit}
.top-icon{height:36px;width:36px;border-radius:var(--radius-sm);background:white;border:1px solid var(--line);font-size:15px;display:grid;place-items:center;transition:var(--tr);position:relative}
.top-icon:hover{background:var(--sage-light);border-color:var(--sage)}
.notif-dot{position:absolute;right:7px;top:6px;width:6px;height:6px;background:#e89b7e;border-radius:50%}

/* ═══ Page Header ═══ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:16px 0 22px;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:#87958e;letter-spacing:.4px;margin-bottom:6px}
.page-head h1{font-size:28px;line-height:1.15;letter-spacing:-.8px;font-weight:700}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:9px 14px;color:#718078;font-size:12px;font-weight:500;transition:var(--tr)}
.pill-btn:hover,.pill-btn.active{background:var(--sage-light);border-color:#c5ddd0;color:var(--sage-dark);font-weight:600}
.primary-btn{border-radius:var(--radius-sm);background:var(--sage);color:white;padding:10px 16px;font-size:12px;font-weight:700;box-shadow:0 4px 12px #4a987b22;transition:var(--tr)}
.primary-btn:hover{background:var(--sage-dark)}

/* ═══ Card ═══ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-head h3{font-size:14px;font-weight:700;margin:0}
.text-link{color:var(--sage);background:none;font-size:11px;font-weight:600;padding:0}
.text-link:hover{text-decoration:underline}

/* ═══ Views ═══ */
.view{display:none}.view.active{display:block}

/* ═══ TODAY ═══ */
.welcome-banner{padding:20px 24px;background:var(--sage-light);border-radius:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;overflow:hidden}
.welcome-banner h2{font-size:17px;margin-bottom:5px;font-weight:70
